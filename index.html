<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Account Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Scrollbar for Provider Filter */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-amber-500 selection:text-slate-950">

    <!-- ADMIN ACTIVE BANNER (Visible only when Admin is logged in) -->
    <div id="adminModeBanner" class="hidden bg-gradient-to-r from-amber-500/20 via-amber-500/10 to-amber-500/20 border-b border-amber-500/30 py-2 px-4 sticky top-0 z-50 backdrop-blur-md">
        <div class="container mx-auto max-w-7xl flex justify-between items-center text-xs">
            <div class="flex items-center gap-2 text-amber-400 font-semibold">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
                </span>
                <span>⚡ Admin Mode Activated - အကောင့်များနှင့် Provider များကို Add / Edit / Delete ပြုလုပ်နိုင်ပါသည်။</span>
            </div>
            <button id="adminHeaderLogoutBtn" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 px-3 py-1 rounded-lg flex items-center gap-1.5 transition text-[11px] font-bold active:scale-95">
                <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Logout
            </button>
        </div>
    </div>

    <!-- TOP NAVIGATION BAR -->
    <nav class="bg-slate-900/90 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-40">
        <div class="container mx-auto px-4 sm:px-6 py-3 max-w-7xl flex justify-between items-center">
            <div class="flex items-center gap-3">
                <!-- Portal Logo -->
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRznkIHOT44uzCN2BDyAslkblIhOQ_5q40IuhEkTRQ1BQ&s=10" 
                     alt="AWS Cloud Logo" 
                     class="w-8 h-8 rounded-xl object-contain bg-slate-950 p-1 border border-slate-800/80 shadow-md">
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wide text-slate-100 flex items-center gap-2">
                        Cloud Account Manager
                    </h1>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Add Provider Button (Visible when Admin) -->
                <button id="openAddProviderModalBtn" class="hidden bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 font-semibold px-3 py-1.5 sm:px-3.5 sm:py-2 rounded-xl flex items-center gap-1.5 transition text-xs active:scale-95">
                    <i data-lucide="folder-plus" class="w-4 h-4"></i>
                    <span>Provider ထည့်ရန်</span>
                </button>

                <!-- Add Account Button (Visible when Admin) -->
                <button id="openAddModalBtn" class="hidden bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl flex items-center gap-1.5 transition text-xs shadow-lg shadow-amber-500/20 active:scale-95">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>အကောင့်ထည့်ရန်</span>
                </button>

                <!-- Admin Action Button -->
                <button id="adminActionBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl flex items-center gap-1.5 transition text-xs font-medium active:scale-95">
                    <i id="adminBtnIcon" data-lucide="lock" class="w-3.5 h-3.5 text-amber-400"></i>
                    <span id="adminBtnText">Admin Login</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="container mx-auto p-4 sm:p-6 max-w-7xl">
        
        <!-- PROVIDER CATEGORY FILTER TABS -->
        <div class="mb-6 overflow-x-auto no-scrollbar pb-2">
            <div class="flex items-center gap-2 min-w-max" id="providerFilterTabs">
                <!-- Dynamically Rendered Tabs -->
            </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8 bg-slate-900/50 border border-slate-800/80 backdrop-blur-md p-4 sm:p-5 rounded-2xl shadow-xl">
            <div class="relative w-full sm:w-80">
                <i data-lucide="search" class="absolute left-3.5 top-3 text-slate-500 w-4 h-4"></i>
                <input type="text" id="searchInput" placeholder="အကောင့်အမည်၊ Email များ ရှာရန်..." 
                    class="w-full bg-slate-950/90 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500/80 transition">
            </div>

            <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-4">
                <div class="text-xs text-slate-400 font-medium bg-slate-950/80 px-4 py-2.5 rounded-xl border border-slate-800/80 flex items-center gap-2">
                    <span>ပြသနေသော အကောင့်အရေအတွက်:</span>
                    <span id="accountCount" class="font-bold text-amber-400 font-mono text-sm">0</span>
                </div>
            </div>
        </div>

        <!-- ACCOUNTS GRID -->
        <div id="accountsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loadingSpinner" class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-amber-500 border-t-transparent"></div>
                <p class="mt-3 text-slate-500 text-xs font-medium">အချက်အလက်များကို ရယူနေပါသည်...</p>
            </div>
        </div>
    </main>

    <!-- ADMIN LOGIN MODAL -->
    <div id="adminLoginModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
            <div class="text-center mb-6">
                <div class="inline-flex bg-amber-500/10 border border-amber-500/20 p-3.5 rounded-2xl text-amber-400 mb-3">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
                <h3 class="text-base font-bold text-slate-100">Admin Panel ဝင်ရန်</h3>
                <p class="text-xs text-slate-400 mt-1">လျှို့ဝှက်စကားဝှက် ရိုက်ထည့်ပါ</p>
            </div>

            <form id="adminLoginForm" class="space-y-4">
                <div>
                    <input type="password" id="loginPassword" required placeholder="Admin Password ထည့်ပါ" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-amber-500/80 transition">
                </div>

                <div class="flex gap-2.5 pt-2">
                    <button type="button" id="closeLoginModalBtn" class="w-1/2 bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-medium text-slate-300 transition">မလုပ်ဆောင်ပါ</button>
                    <button type="submit" class="w-1/2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs flex justify-center items-center gap-1 shadow-lg shadow-amber-500/20 transition">
                        Login ဝင်မည်
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADD PROVIDER MODAL (Admin Only) -->
    <div id="addProviderModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-5 border-b border-slate-800/80 pb-4">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="folder-plus" class="w-4 h-4 text-amber-400"></i> Provider အသစ်ထည့်ရန်
                </h3>
                <button id="closeProviderModalBtn" class="text-slate-400 hover:text-slate-200 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="addProviderForm" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="tag" class="w-3.5 h-3.5 text-amber-400"></i> Provider အမည်
                    </label>
                    <input type="text" id="newProviderName" required placeholder="ဥပမာ- AWS, Hetzner, Hostinger" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="image" class="w-3.5 h-3.5 text-amber-400"></i> Logo Image URL
                    </label>
                    <input type="url" id="newProviderLogo" required placeholder="https://example.com/logo.png" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div class="flex justify-end gap-2.5 pt-3 border-t border-slate-800/80">
                    <button type="button" id="cancelProviderBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 transition">မလုပ်ဆောင်ပါ</button>
                    <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/20 transition">
                        <i data-lucide="check" class="w-4 h-4"></i> Provider သိမ်းမည်
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ADD/EDIT ACCOUNT MODAL (Admin Only) -->
    <div id="accountModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-5 border-b border-slate-800/80 pb-4">
                <h3 id="modalTitle" class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-4 h-4 text-amber-400"></i> အကောင့်အသစ်ထည့်ရန်
                </h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-200 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="accountForm" class="space-y-4">
                <input type="hidden" id="accountId">
                
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="layers" class="w-3.5 h-3.5 text-amber-400"></i> Cloud Provider အမျိုးအစား
                    </label>
                    <select id="provider" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                        <!-- Dynamically Rendered Options -->
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="server" class="w-3.5 h-3.5 text-amber-400"></i> အကောင့်အမည်
                    </label>
                    <input type="text" id="accountName" required placeholder="ဥပမာ- Account 1" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="mail" class="w-3.5 h-3.5 text-amber-400"></i> Email
                    </label>
                    <input type="email" id="email" required placeholder="example@gmail.com" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="key-round" class="w-3.5 h-3.5 text-amber-400"></i> Password
                    </label>
                    <input type="text" id="password" required placeholder="••••••••" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500 font-mono">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="id-card" class="w-3.5 h-3.5 text-amber-400"></i> Access Key
                    </label>
                    <input type="text" id="accessKey" placeholder="AKIAIOSFODNN7EXAMPLE" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500 font-mono">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-400"></i> Secret Key
                    </label>
                    <input type="text" id="secretKey" placeholder="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500 font-mono">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="shield" class="w-3.5 h-3.5 text-amber-400"></i> 2FA Code / Key
                    </label>
                    <input type="text" id="twoFactor" placeholder="JBSWY3DPEHPK3PXP" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500 font-mono">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <i data-lucide="sticky-note" class="w-3.5 h-3.5 text-amber-400"></i> Note (မှတ်ချက်)
                    </label>
                    <textarea id="notes" rows="3" placeholder="မှတ်ချက်များ ရေးရန်..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div class="flex justify-end gap-2.5 pt-3 border-t border-slate-800/80">
                    <button type="button" id="cancelBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 transition">မလုပ်ဆောင်ပါ</button>
                    <button type="submit" class="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/20 transition">
                        <i data-lucide="check" class="w-4 h-4"></i> သိမ်းဆည်းမည်
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 border border-emerald-500/40 text-emerald-400 px-4 py-3 rounded-2xl shadow-2xl translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2.5 z-50 text-xs backdrop-blur-xl">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span id="toastMsg">အောင်မြင်ပါသည်။</span>
    </div>

    <!-- FIREBASE MODULES -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Default Providers Mapping
        const DEFAULT_PROVIDERS = [
            { name: "CloudFront", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0Zjj8_t-AF9pwo9gdC9VwHGU2wZL9kw2o9IAUSRT6Cg&s=10" },
            { name: "Linode", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNqxST3aKfUNXxesuGv74mstVHSKVmemlP9491ofhuDg&s=10" },
            { name: "Vultr", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEGPW9AYIjbiz1RUVcYbTQflzjK1hBRHigazE0D6NDBA&s=10" },
            { name: "Digital Ocean", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQVETcsMwMgIqVLvaPL1Y0n_XXx20cJpJBN3-0oTiveRg&s=10" },
            { name: "Kamatera", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTHAH3qCmPKK3fwBcsZki5_Wajubu4O3A9tqi8k8N80A&s=10" },
            { name: "GCP", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQwprIWeHLYQxZOxE5QYzSnctoB1oBgCf_OWE38MRU4cg&s" }
        ];

        // Admin Password
        const ADMIN_PASSWORD_SECRET = "juevpnth@gmail.com";

        // Firebase Config
        const userFirebaseConfig = {
            apiKey: "AIzaSyAp2U4bryqATGTdMVHDqRNr-ljt6tZu5OM",
            authDomain: "cloudfornt.firebaseapp.com",
            projectId: "cloudfornt",
            storageBucket: "cloudfornt.firebasestorage.app",
            messagingSenderId: "978230789905",
            appId: "1:978230789905:web:f01bf6b76256182cc5eeb0",
            measurementId: "G-77EW81S7Z0"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : userFirebaseConfig;

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cloudfornt';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isAdmin = false;
        let accountsData = [];
        let customProviders = [];
        let selectedCategory = 'ALL';

        // Auth Setup
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        };

        initAuth().then(() => {
            subscribeToProviders();
            subscribeToAccounts();
        });

        // Combined Providers Helper
        function getAllProviders() {
            const list = [...DEFAULT_PROVIDERS];
            customProviders.forEach(cp => {
                if (!list.some(p => p.name.toLowerCase() === cp.name.toLowerCase())) {
                    list.push(cp);
                }
            });
            return list;
        }

        function getProviderLogo(providerName) {
            const all = getAllProviders();
            const found = all.find(p => p.name.toLowerCase() === (providerName || '').toLowerCase());
            return found ? found.logo : "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0Zjj8_t-AF9pwo9gdC9VwHGU2wZL9kw2o9IAUSRT6Cg&s=10";
        }

        // Realtime Listener for Custom Providers
        function subscribeToProviders() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cloud_providers');
            onSnapshot(colRef, (snapshot) => {
                customProviders = [];
                snapshot.forEach((doc) => {
                    customProviders.push({ id: doc.id, ...doc.data() });
                });
                renderProviderTabs();
                renderProviderSelectOptions();
                updateCategoryCounts();
                renderAccounts(accountsData);
            }, (err) => {
                console.error("Provider fetch error:", err);
            });
        }

        // Render Filter Tabs
        function renderProviderTabs() {
            const tabsContainer = document.getElementById('providerFilterTabs');
            const providers = getAllProviders();

            let html = `
                <button data-provider="ALL" class="provider-tab ${selectedCategory === 'ALL' ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/10' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800'} px-4 py-2 rounded-xl text-xs flex items-center gap-2 transition">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                    <span>ALL</span>
                    <span id="count-ALL" class="bg-slate-950/20 px-1.5 py-0.5 rounded-md text-[10px] font-mono">0</span>
                </button>
            `;

            providers.forEach(p => {
                const isActive = selectedCategory === p.name;
                const safeName = escapeHtml(p.name);
                html += `
                    <button data-provider="${safeName}" class="provider-tab ${isActive ? 'bg-amber-500 text-slate-950 font-bold shadow-lg shadow-amber-500/10' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800'} px-3.5 py-2 rounded-xl text-xs flex items-center gap-2 transition">
                        <img src="${escapeHtml(p.logo)}" class="w-4 h-4 rounded object-contain" alt="${safeName}">
                        <span>${safeName}</span>
                        <span id="count-${safeName}" class="bg-slate-950 px-1.5 py-0.5 rounded-md text-[10px] font-mono text-slate-400">0</span>
                    </button>
                `;
            });

            tabsContainer.innerHTML = html;

            // Re-attach tab click events
            document.querySelectorAll('.provider-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const button = e.currentTarget;
                    selectedCategory = button.getAttribute('data-provider');
                    renderProviderTabs();
                    updateCategoryCounts();
                    renderAccounts(accountsData);
                });
            });

            lucide.createIcons();
        }

        // Render Select Menu in Add Account Form
        function renderProviderSelectOptions() {
            const selectEl = document.getElementById('provider');
            const providers = getAllProviders();
            selectEl.innerHTML = providers.map(p => `
                <option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>
            `).join('');
        }

        // UI State Update (Admin vs Normal)
        function updateUIState() {
            const openAddModalBtn = document.getElementById('openAddModalBtn');
            const openAddProviderModalBtn = document.getElementById('openAddProviderModalBtn');
            const adminActionBtn = document.getElementById('adminActionBtn');
            const adminBtnText = document.getElementById('adminBtnText');
            const adminBtnIcon = document.getElementById('adminBtnIcon');
            const adminModeBanner = document.getElementById('adminModeBanner');

            if (isAdmin) {
                openAddModalBtn.classList.remove('hidden');
                openAddProviderModalBtn.classList.remove('hidden');
                adminModeBanner.classList.remove('hidden');
                adminBtnText.textContent = "Admin Logout";
                adminActionBtn.className = "bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl flex items-center gap-1.5 transition text-xs font-medium active:scale-95";
                adminBtnIcon.setAttribute("data-lucide", "log-out");
                adminBtnIcon.className = "w-3.5 h-3.5 text-rose-400";
            } else {
                openAddModalBtn.classList.add('hidden');
                openAddProviderModalBtn.classList.add('hidden');
                adminModeBanner.classList.add('hidden');
                adminBtnText.textContent = "Admin Login";
                adminActionBtn.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 px-3.5 py-1.5 sm:px-4 sm:py-2 rounded-xl flex items-center gap-1.5 transition text-xs font-medium active:scale-95";
                adminBtnIcon.setAttribute("data-lucide", "lock");
                adminBtnIcon.className = "w-3.5 h-3.5 text-amber-400";
            }
            lucide.createIcons();
            renderAccounts(accountsData);
        }

        // Realtime Listener for Accounts
        function subscribeToAccounts() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cloudfront_accounts');

            onSnapshot(colRef, (snapshot) => {
                accountsData = [];
                snapshot.forEach((doc) => {
                    accountsData.push({ id: doc.id, ...doc.data() });
                });

                accountsData.sort((a, b) => {
                    const nameA = a.accountName || '';
                    const nameB = b.accountName || '';
                    return nameA.localeCompare(nameB, undefined, { numeric: true, sensitivity: 'base' });
                });

                updateCategoryCounts();
                renderAccounts(accountsData);
            }, (error) => {
                console.error("Firestore error:", error);
            });
        }

        // Category Tab Counts
        function updateCategoryCounts() {
            const providers = getAllProviders();
            const counts = { "ALL": accountsData.length };
            providers.forEach(p => counts[p.name] = 0);

            accountsData.forEach(acc => {
                const prov = acc.provider || 'CloudFront';
                if (counts[prov] !== undefined) {
                    counts[prov]++;
                } else {
                    counts[prov] = (counts[prov] || 0) + 1;
                }
            });

            Object.keys(counts).forEach(key => {
                const countEl = document.getElementById(`count-${key}`);
                if (countEl) countEl.textContent = counts[key];
            });
        }

        // Toggle Mask/Reveal for Email and Password
        window.toggleVisibility = (id) => {
            const el = document.getElementById(id);
            if (!el) return;
            const realVal = el.getAttribute('data-real-val') || '';
            const isHidden = el.getAttribute('data-hidden') === 'true';

            if (isHidden) {
                el.textContent = realVal || '-';
                el.setAttribute('data-hidden', 'false');
            } else {
                el.textContent = '••••••••';
                el.setAttribute('data-hidden', 'true');
            }
        };

        // Render Cards
        function renderAccounts(data) {
            const grid = document.getElementById('accountsGrid');
            const countEl = document.getElementById('accountCount');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let filtered = data;

            // 1. Filter by Selected Category
            if (selectedCategory !== 'ALL') {
                filtered = filtered.filter(acc => (acc.provider || 'CloudFront') === selectedCategory);
            }

            // 2. Filter by Search Text
            filtered = filtered.filter(acc => 
                (acc.accountName && acc.accountName.toLowerCase().includes(searchVal)) ||
                (acc.email && acc.email.toLowerCase().includes(searchVal)) ||
                (acc.notes && acc.notes.toLowerCase().includes(searchVal))
            );

            countEl.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-slate-900/30 border border-slate-800/60 rounded-3xl p-10 text-center text-slate-500">
                        <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-3 text-slate-600"></i>
                        <p class="text-xs">မည်သည့် အကောင့်မျှ မရှိသေးပါ။</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = filtered.map(acc => {
                const prov = acc.provider || 'CloudFront';
                const logoUrl = getProviderLogo(prov);

                return `
                <div class="bg-slate-900/70 border border-slate-800/80 hover:border-slate-700/80 rounded-3xl p-4 sm:p-5 backdrop-blur-md shadow-xl transition-all duration-200 flex flex-col justify-between group overflow-hidden">
                    <div>
                        <!-- Title with Green Pulsing Dot, Provider Logo & Actions -->
                        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80 gap-2">
                            <div class="flex items-center gap-2.5 truncate">
                                <!-- Provider Logo -->
                                <img src="${escapeHtml(logoUrl)}" alt="${escapeHtml(prov)}" class="w-5 h-5 rounded object-contain flex-shrink-0 bg-slate-950 p-0.5 border border-slate-800">
                                
                                <h3 class="font-bold text-sm text-slate-100 flex items-center gap-2 truncate">
                                    <span class="truncate">${escapeHtml(acc.accountName || 'CloudAccount')}</span>
                                </h3>

                                <!-- Pulsing Green Indicator Light -->
                                <span class="relative flex h-2 w-2 flex-shrink-0">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                </span>
                            </div>

                            ${isAdmin ? `
                                <div class="flex items-center gap-1 flex-shrink-0">
                                    <button onclick="editAccount('${acc.id}')" class="p-1.5 text-slate-400 hover:text-amber-400 hover:bg-slate-800 rounded-lg transition" title="ပြင်ရန်">
                                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button onclick="deleteAccount('${acc.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition" title="ဖျက်ရန်">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            ` : `
                                <span class="text-[10px] text-slate-400 font-mono bg-slate-950 px-2 py-0.5 rounded-full border border-slate-800 flex-shrink-0">${escapeHtml(prov)}</span>
                            `}
                        </div>

                        <!-- Account Details with Icons & Hidden Email/Password -->
                        <div class="space-y-2 text-xs">
                            <!-- Email (Hidden by Default) -->
                            <div class="flex items-center justify-between bg-slate-950/80 px-3 py-2 rounded-xl border border-slate-800/60 gap-2">
                                <span class="text-slate-400 text-[11px] flex items-center gap-1.5 flex-shrink-0">
                                    <i data-lucide="mail" class="w-3.5 h-3.5 text-amber-400"></i>
                                    Email
                                </span>
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <span id="email-${acc.id}" data-hidden="true" data-real-val="${escapeHtml(acc.email || '-')}" class="font-mono text-slate-200 select-all truncate text-[11px] sm:text-xs">••••••••</span>
                                    <button onclick="toggleVisibility('email-${acc.id}')" class="text-slate-500 hover:text-amber-400 transition flex-shrink-0" title="ကြည့်ရန်/ဖုံးရန်">
                                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button onclick="copyText('${escapeJs(acc.email)}')" class="text-slate-500 hover:text-amber-400 transition flex-shrink-0" title="Copy">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Password (Hidden by Default) -->
                            <div class="flex items-center justify-between bg-slate-950/80 px-3 py-2 rounded-xl border border-slate-800/60 gap-2">
                                <span class="text-slate-400 text-[11px] flex items-center gap-1.5 flex-shrink-0">
                                    <i data-lucide="key-round" class="w-3.5 h-3.5 text-amber-400"></i>
                                    Password
                                </span>
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <span id="pass-${acc.id}" data-hidden="true" data-real-val="${escapeHtml(acc.password || '-')}" class="font-mono text-slate-200 select-all truncate text-[11px] sm:text-xs">••••••••</span>
                                    <button onclick="toggleVisibility('pass-${acc.id}')" class="text-slate-500 hover:text-amber-400 transition flex-shrink-0" title="ကြည့်ရန်/ဖုံးရန်">
                                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button onclick="copyText('${escapeJs(acc.password)}')" class="text-slate-500 hover:text-amber-400 transition flex-shrink-0" title="Copy">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Access Key -->
                            <div class="flex items-center justify-between bg-slate-950/80 px-3 py-2 rounded-xl border border-slate-800/60 gap-2">
                                <span class="text-slate-400 text-[11px] flex items-center gap-1.5 flex-shrink-0">
                                    <i data-lucide="id-card" class="w-3.5 h-3.5 text-amber-400"></i>
                                    Access Key
                                </span>
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <span class="font-mono text-slate-200 select-all text-[11px] sm:text-xs truncate max-w-[130px] sm:max-w-[160px]">${escapeHtml(acc.accessKey || '-')}</span>
                                    <button onclick="copyText('${escapeJs(acc.accessKey)}')" class="text-slate-500 hover:text-amber-400 transition flex-shrink-0" title="Copy">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Secret Key -->
                            <div class="flex items-center justify-between bg-slate-950/80 px-3 py-2 rounded-xl border border-slate-800/60 gap-2">
                                <span class="text-slate-400 text-[11px] flex items-center gap-1.5 flex-shrink-0">
                                    <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-400"></i>
                                    Secret Key
                                </span>
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <span class="font-mono text-slate-200 select-all text-[11px] sm:text-xs truncate max-w-[130px] sm:max-w-[160px]">${escapeHtml(acc.secretKey || '-')}</span>
                                    <button onclick="copyText('${escapeJs(acc.secretKey)}')" class="text-slate-500 hover:text-amber-400 transition flex-shrink-0" title="Copy">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 2FA Key -->
                            <div class="flex items-center justify-between bg-slate-950/80 px-3 py-2 rounded-xl border border-slate-800/60 gap-2">
                                <span class="text-slate-400 text-[11px] flex items-center gap-1.5 flex-shrink-0">
                                    <i data-lucide="shield" class="w-3.5 h-3.5 text-amber-400"></i>
                                    2FA Key
                                </span>
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <span class="font-mono text-amber-300 font-medium select-all text-[11px] sm:text-xs truncate max-w-[130px] sm:max-w-[160px] break-all">${escapeHtml(acc.twoFactor || '-')}</span>
                                    <button onclick="copyText('${escapeJs(acc.twoFactor)}')" class="text-slate-500 hover:text-amber-400 transition flex-shrink-0" title="Copy">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>

                            ${acc.notes ? `
                                <div class="mt-3 pt-2 border-t border-slate-800/60">
                                    <span class="text-[10px] text-slate-400 block mb-1 flex items-center gap-1 font-medium">
                                        <i data-lucide="sticky-note" class="w-3 h-3 text-amber-400"></i> Note
                                    </span>
                                    <p class="text-xs text-slate-300 bg-slate-950/90 p-2.5 rounded-xl border border-slate-800/60 whitespace-pre-wrap break-words">${escapeHtml(acc.notes)}</p>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `}).join('');

            lucide.createIcons();
        }

        // Logout Handler (Both Buttons)
        const handleLogout = () => {
            if (confirm("Admin မုဒ်မှ ထွက်ပါမည်လား?")) {
                isAdmin = false;
                updateUIState();
                showToast("Admin Logout ထွက်ပြီးပါပြီ။");
            }
        };

        const closeAdminLoginModal = () => {
            const modal = document.getElementById('adminLoginModal');
            if (modal) {
                modal.classList.add('hidden');
            }
            const passInput = document.getElementById('loginPassword');
            if (passInput) {
                passInput.value = '';
            }
        };

        document.getElementById('adminActionBtn').addEventListener('click', () => {
            if (isAdmin) {
                handleLogout();
            } else {
                const modal = document.getElementById('adminLoginModal');
                if (modal) modal.classList.remove('hidden');
            }
        });

        document.getElementById('adminHeaderLogoutBtn').addEventListener('click', handleLogout);

        document.getElementById('closeLoginModalBtn').addEventListener('click', closeAdminLoginModal);

        // Login Check & Auto Close Modal Fix
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const inputPassword = document.getElementById('loginPassword').value.trim();

            if (inputPassword === ADMIN_PASSWORD_SECRET) {
                isAdmin = true;
                
                // Directly close and hide the admin login modal immediately
                closeAdminLoginModal();
                
                updateUIState();
                showToast("Admin အဖြစ် ဝင်ရောက်ပြီးပါပြီ။");
            } else {
                showToast("Password မှားယွင်းနေပါသည်", true);
            }
        });

        // Add Provider Form Submit Handler
        document.getElementById('addProviderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin) return;

            const name = document.getElementById('newProviderName').value.trim();
            const logo = document.getElementById('newProviderLogo').value.trim();

            if (!name || !logo) return;

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cloud_providers');
                await addDoc(colRef, {
                    name: name,
                    logo: logo,
                    createdAt: serverTimestamp()
                });

                document.getElementById('addProviderModal').classList.add('hidden');
                document.getElementById('addProviderForm').reset();
                showToast(`Provider "${name}" အသစ် ထည့်သွင်းပြီးပါပြီ။`);
            } catch (err) {
                console.error("Save provider error:", err);
                showToast("Provider ထည့်၍ မရပါ", true);
            }
        });

        // Modal Controls for Provider Add
        document.getElementById('openAddProviderModalBtn').addEventListener('click', () => {
            document.getElementById('addProviderModal').classList.remove('hidden');
        });

        document.getElementById('closeProviderModalBtn').addEventListener('click', () => {
            document.getElementById('addProviderModal').classList.add('hidden');
            document.getElementById('addProviderForm').reset();
        });

        document.getElementById('cancelProviderBtn').addEventListener('click', () => {
            document.getElementById('addProviderModal').classList.add('hidden');
            document.getElementById('addProviderForm').reset();
        });

        // Edit Account
        window.editAccount = (id) => {
            if (!isAdmin) return;
            const acc = accountsData.find(a => a.id === id);
            if (!acc) return;

            document.getElementById('modalTitle').textContent = 'အကောင့် ပြင်ဆင်ရန်';
            document.getElementById('accountId').value = acc.id;
            document.getElementById('provider').value = acc.provider || 'CloudFront';
            document.getElementById('accountName').value = acc.accountName || '';
            document.getElementById('email').value = acc.email || '';
            document.getElementById('password').value = acc.password || '';
            document.getElementById('accessKey').value = acc.accessKey || '';
            document.getElementById('secretKey').value = acc.secretKey || '';
            document.getElementById('twoFactor').value = acc.twoFactor || '';
            document.getElementById('notes').value = acc.notes || '';

            openModal();
        };

        // Delete Account
        window.deleteAccount = async (id) => {
            if (!isAdmin) return;
            if (confirm("ဤအကောင့်ကို ဖျက်ရန် သေချာပါသလား?")) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloudfront_accounts', id);
                    await deleteDoc(docRef);
                    showToast("ဖျက်ပြီးပါပြီ။");
                } catch (err) {
                    showToast("ဖျက်၍ မရပါ", true);
                }
            }
        };

        // Copy Text
        window.copyText = (text) => {
            if (!text || text === 'undefined') return;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("Copy ကူးပြီးပါပြီ!");
            } catch (err) {}
            document.body.removeChild(textArea);
        };

        // Save Account Form
        document.getElementById('accountForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin) return;

            const id = document.getElementById('accountId').value;
            const data = {
                provider: document.getElementById('provider').value,
                accountName: document.getElementById('accountName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value.trim(),
                accessKey: document.getElementById('accessKey').value.trim(),
                secretKey: document.getElementById('secretKey').value.trim(),
                twoFactor: document.getElementById('twoFactor').value.trim(),
                notes: document.getElementById('notes').value.trim(),
                updatedAt: serverTimestamp()
            };

            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cloudfront_accounts');

            try {
                if (id) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'cloudfront_accounts', id);
                    await updateDoc(docRef, data);
                    showToast("ပြင်ဆင်မှုများ သိမ်းဆည်းပြီးပါပြီ။");
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(colRef, data);
                    showToast("အကောင့်အသစ် ထည့်သွင်းပြီးပါပြီ။");
                }
                closeModal();
            } catch (err) {
                showToast("သိမ်းဆည်း၍ မရပါ", true);
            }
        });

        // Modal Helpers
        const modal = document.getElementById('accountModal');
        function openModal() { modal.classList.remove('hidden'); }
        function closeModal() {
            modal.classList.add('hidden');
            document.getElementById('accountForm').reset();
            document.getElementById('accountId').value = '';
        }

        document.getElementById('openAddModalBtn').addEventListener('click', () => {
            document.getElementById('modalTitle').textContent = 'အကောင့်အသစ်ထည့်ရန်';
            document.getElementById('provider').value = selectedCategory !== 'ALL' ? selectedCategory : 'CloudFront';
            document.getElementById('accountName').value = `Account ${accountsData.length + 1}`;
            openModal();
        });

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('cancelBtn').addEventListener('click', closeModal);
        document.getElementById('searchInput').addEventListener('input', () => renderAccounts(accountsData));

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.className = `fixed bottom-5 right-5 bg-slate-900 border ${isError ? 'border-rose-500/40 text-rose-400' : 'border-emerald-500/40 text-emerald-400'} px-4 py-3 rounded-2xl shadow-2xl transition-all duration-300 flex items-center gap-2.5 z-50 text-xs backdrop-blur-xl`;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }

        function escapeJs(str) {
            if (!str) return '';
            return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        lucide.createIcons();
    </script>
</body>
</html>
